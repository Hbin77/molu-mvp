services:
  web:
    build:
      context: .
    image: molu-mvp:latest
    container_name: molu-mvp
    restart: unless-stopped
    # Bind to loopback only — the public edge is Cloudflare Tunnel.
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Where Next.js (server-side) proxies /api/v1/* to. Reaches the
      # molu-api container over the shared `molu-net` docker network.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://molu-api:8000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - molu-net

networks:
  molu-net:
    external: true
    name: molu-net
